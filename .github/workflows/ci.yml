name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Type-check Supabase Edge Functions
        working-directory: supabase/functions
        run: npx --yes deno@2 check --config deno.json send-reminders/index.ts push-test/index.ts grade-recall/index.ts
